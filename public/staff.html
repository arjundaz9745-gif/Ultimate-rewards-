<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Panel | Ultimate Rewards</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <nav class="navbar glass">
    <div class="nav-brand">
      <img src="/logo.png" alt="UR" class="logo-img">
      <span class="brand-text">Staff Panel</span>
    </div>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/dashboard.html" class="nav-link">Member View</a>
      <a href="/auth/logout" class="btn secondary sm">Logout</a>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="page-header">
      <h1>Staff Dashboard</h1>
      <div class="user-pill" id="userPill">Loading...</div>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div style="margin-bottom:1.25rem; display:flex; gap:0.6rem; flex-wrap:wrap;">
      <button class="btn sm secondary filter-btn" data-status="">All</button>
      <button class="btn sm secondary filter-btn" data-status="open">Open</button>
      <button class="btn sm secondary filter-btn" data-status="pending_payment">Pending</button>
      <button class="btn sm secondary filter-btn" data-status="paid">Paid</button>
      <button class="btn sm secondary filter-btn" data-status="delivered">Delivered</button>
    </div>

    <div id="ticketsList">Loading tickets...</div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="hidden" style="position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(0,0,0,0.7);">
    <div class="glass-card" style="max-width:420px;width:100%;padding:1.75rem;position:relative;">
      <button onclick="closeModal()" style="position:absolute;top:0.8rem;right:1rem;background:none;border:none;color:var(--text-muted);font-size:1.4rem;cursor:pointer;">×</button>
      <h2 style="font-family:var(--display);color:var(--gold-light);margin-bottom:1rem;">Update Ticket</h2>
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>Status</label>
        <select id="editStatus">
          <option value="open">Open</option>
          <option value="pending_payment">Pending Payment</option>
          <option value="paid">Paid</option>
          <option value="delivered">Delivered</option>
          <option value="closed">Closed</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="form-group">
        <label>Staff Note</label>
        <textarea id="editNote" placeholder="Internal note or message to customer..."></textarea>
      </div>
      <button class="btn primary full" onclick="saveTicket()">Save Changes</button>
    </div>
  </div>

  <script>
    let currentFilter = '';

    async function init() {
      const me = await fetch('/api/me', { credentials: 'include' }).then(r => r.json());
      if (!me.loggedIn) {
        window.location.href = '/auth/login';
        return;
      }
      if (!me.user.is_staff) {
        alert('Staff only. You do not have the required role.');
        window.location.href = '/dashboard.html';
        return;
      }

      const avatar = me.user.avatar
        ? `https://cdn.discordapp.com/avatars/${me.user.id}/${me.user.avatar}.png?size=64`
        : 'https://cdn.discordapp.com/embed/avatars/0.png';

      document.getElementById('userPill').innerHTML = `
        <img src="${avatar}" class="user-avatar" alt="">
        <span>${me.user.global_name || me.user.username} · Staff</span>
      `;

      loadStats();
      loadTickets();
    }

    async function loadStats() {
      const s = await fetch('/api/staff/stats', { credentials: 'include' }).then(r => r.json());
      document.getElementById('statsRow').innerHTML = `
        <div class="stat-card glass-card"><div class="stat-value">${s.total}</div><div class="stat-label">Total</div></div>
        <div class="stat-card glass-card"><div class="stat-value">${s.open}</div><div class="stat-label">Open</div></div>
        <div class="stat-card glass-card"><div class="stat-value">${s.pending}</div><div class="stat-label">Pending</div></div>
        <div class="stat-card glass-card"><div class="stat-value">${s.paid}</div><div class="stat-label">Paid</div></div>
        <div class="stat-card glass-card"><div class="stat-value">${s.delivered}</div><div class="stat-label">Delivered</div></div>
      `;
    }

    async function loadTickets() {
      const url = currentFilter ? `/api/staff/tickets?status=${currentFilter}` : '/api/staff/tickets';
      const tickets = await fetch(url, { credentials: 'include' }).then(r => r.json());
      const list = document.getElementById('ticketsList');
      if (!tickets.length) {
        list.innerHTML = '<p style="color:var(--text-muted)">No tickets found.</p>';
        return;
      }
      list.innerHTML = tickets.map(t => {
        const avatar = t.avatar
          ? `https://cdn.discordapp.com/avatars/${t.user_id}/${t.avatar}.png?size=32`
          : 'https://cdn.discordapp.com/embed/avatars/0.png';
        return `
          <div class="ticket-card glass-card">
            <div>
              <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.3rem;">
                <img src="${avatar}" style="width:24px;height:24px;border-radius:50%;">
                <span>${t.global_name || t.username}</span>
                <span class="ticket-id">#${t.id}</span>
              </div>
              <strong>${t.product_name}</strong> · ${t.price}
              <div style="font-size:0.85rem;color:var(--text-muted);margin-top:0.3rem;">
                ${t.payment_proof ? `Proof: ${t.payment_proof}<br>` : ''}
                ${t.customer_note ? `Customer: ${t.customer_note}<br>` : ''}
                ${t.staff_note ? `<em>Staff note: ${t.staff_note}</em>` : ''}
              </div>
              <div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.3rem;">
                ${new Date(t.created_at + 'Z').toLocaleString()}
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.5rem;">
              <span class="status ${t.status}">${t.status.replace('_',' ')}</span>
              <button class="btn sm primary" onclick='openEdit(${JSON.stringify(t)})'>Manage</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openEdit(t) {
      document.getElementById('editId').value = t.id;
      document.getElementById('editStatus').value = t.status;
      document.getElementById('editNote').value = t.staff_note || '';
      document.getElementById('editModal').classList.remove('hidden');
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('editModal').classList.add('hidden');
      document.getElementById('editModal').style.display = 'none';
    }

    async function saveTicket() {
      const id = document.getElementById('editId').value;
      const status = document.getElementById('editStatus').value;
      const staff_note = document.getElementById('editNote').value;
      await fetch(`/api/staff/tickets/${id}`, {
        method: 'PATCH',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status, staff_note })
      });
      closeModal();
      loadStats();
      loadTickets();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.status;
        loadTickets();
      });
    });

    init();
  </script>
</body>
</html>
