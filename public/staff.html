<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff | Ultimate Rewards</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg-scene" aria-hidden="true"></div>
  <div class="bg-scene-overlay" aria-hidden="true"></div>
  <div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
  <nav class="navbar glass">
    <div class="nav-brand">
      <img src="/logo.png" alt="UR" class="logo-img">
      <span class="brand-text">Staff Panel</span>
    </div>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/dashboard.html" class="nav-link">Member view</a>
      <a href="/auth/logout" class="btn secondary sm">Logout</a>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="page-header">
      <h1>Staff</h1>
      <div class="user-pill" id="userPill">...</div>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div style="margin-bottom:1.25rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
      <button class="btn sm secondary filter-btn" data-status="">All</button>
      <button class="btn sm secondary filter-btn" data-status="open">Open</button>
      <button class="btn sm secondary filter-btn" data-status="pending_payment">Pending</button>
      <button class="btn sm secondary filter-btn" data-status="paid">Paid</button>
      <button class="btn sm secondary filter-btn" data-status="delivered">Delivered</button>
    </div>

    <div id="ticketsList">Loading...</div>
  </div>

  <div id="editModal" class="hidden" style="position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);">
    <div class="glass-card" style="max-width:480px;width:100%;padding:1.75rem;position:relative;max-height:90vh;overflow-y:auto;">
      <button onclick="closeModal()" style="position:absolute;top:0.8rem;right:1rem;background:none;border:none;color:var(--text-muted);font-size:1.4rem;cursor:pointer;">×</button>
      <h2 style="font-family:var(--display);color:var(--gold-light);margin-bottom:0.5rem;" id="modalTitle">Ticket</h2>
      <div id="modalBody"></div>
      <div class="form-group" style="margin-top:1rem;">
        <label>Status</label>
        <select id="editStatus">
          <option value="open">Open</option>
          <option value="pending_payment">Pending Payment</option>
          <option value="paid">Paid</option>
          <option value="delivered">Delivered</option>
          <option value="closed">Closed</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="form-group">
        <label>Reply as staff</label>
        <textarea id="editReply" placeholder="Message to customer..."></textarea>
      </div>
      <button class="btn primary full" onclick="saveTicket()">Save & Send</button>
    </div>
  </div>

  <script>
    let currentFilter = '';
    let currentTicket = null;

    function escapeHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function init() {
      const me = await fetch('/api/me', { credentials: 'include' }).then(r => r.json());
      if (!me.loggedIn) return location.href = '/auth/login';
      if (!me.user.is_staff) {
        alert('Staff only');
        return location.href = '/dashboard.html';
      }
      const avatar = me.user.avatar
        ? `https://cdn.discordapp.com/avatars/${me.user.id}/${me.user.avatar}.png?size=64`
        : 'https://cdn.discordapp.com/embed/avatars/0.png';
      document.getElementById('userPill').innerHTML = `<img src="${avatar}" class="user-avatar"><span>${me.user.global_name || me.user.username}</span>`;
      loadStats();
      loadTickets();
    }

    async function loadStats() {
      const s = await fetch('/api/staff/stats', { credentials: 'include' }).then(r => r.json());
      document.getElementById('statsRow').innerHTML = `
        <div class="stat-card glass-card"><div class="stat-value">${s.total}</div><div class="stat-label">Total</div></div>
        <div class="stat-card glass-card"><div class="stat-value">${s.open}</div><div class="stat-label">Open</div></div>
        <div class="stat-card glass-card"><div class="stat-value">${s.pending}</div><div class="stat-label">Pending</div></div>
        <div class="stat-card glass-card"><div class="stat-value">${s.paid}</div><div class="stat-label">Paid</div></div>
        <div class="stat-card glass-card"><div class="stat-value">${s.delivered}</div><div class="stat-label">Delivered</div></div>
      `;
    }

    function renderMessages(msgs) {
      if (!msgs || !msgs.length) return '<p style="color:var(--text-muted);font-size:0.9rem;">No messages yet</p>';
      return `<div class="messages">${msgs.map(m => `
        <div class="msg ${m.from}">
          <div class="msg-meta">${escapeHtml(m.name || m.from)} · ${new Date(m.at).toLocaleString()}</div>
          <div>${escapeHtml(m.text)}</div>
        </div>
      `).join('')}</div>`;
    }

    async function loadTickets() {
      const url = currentFilter ? `/api/staff/tickets?status=${currentFilter}` : '/api/staff/tickets';
      const tickets = await fetch(url, { credentials: 'include' }).then(r => r.json());
      const list = document.getElementById('ticketsList');
      if (!tickets.length) {
        list.innerHTML = '<p style="color:var(--text-muted)">No tickets</p>';
        return;
      }
      list.innerHTML = tickets.map(t => {
        const avatar = t.avatar
          ? `https://cdn.discordapp.com/avatars/${t.user_id}/${t.avatar}.png?size=32`
          : 'https://cdn.discordapp.com/embed/avatars/0.png';
        return `
          <div class="ticket-card glass-card">
            <div style="width:100%">
              <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem;flex-wrap:wrap;">
                <img src="${avatar}" style="width:26px;height:26px;border-radius:50%;">
                <span>${escapeHtml(t.global_name || t.username)}</span>
                <span class="ticket-id">#${t.id}</span>
                <span class="status ${t.status}">${t.status.replace('_',' ')}</span>
              </div>
              <strong>${escapeHtml(t.product_name)}</strong> · ${escapeHtml(t.price)}
              ${t.payment_proof ? `<div style="font-size:0.85rem;color:var(--text-muted);">Proof: ${escapeHtml(t.payment_proof)}</div>` : ''}
              ${renderMessages(t.messages)}
              <button class="btn sm primary" style="margin-top:0.5rem" onclick='openEdit(${JSON.stringify(t).replace(/'/g,"&#39;")})'>Open</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openEdit(t) {
      currentTicket = t;
      document.getElementById('modalTitle').textContent = `#${t.id} · ${t.product_name}`;
      document.getElementById('editStatus').value = t.status;
      document.getElementById('editReply').value = '';
      document.getElementById('modalBody').innerHTML = `
        <div style="font-size:0.9rem;color:var(--text-muted);margin-bottom:0.5rem;">
          ${escapeHtml(t.global_name || t.username)} · ${escapeHtml(t.price)}
          ${t.payment_proof ? `<br>Proof: ${escapeHtml(t.payment_proof)}` : ''}
        </div>
        ${renderMessages(t.messages)}
      `;
      document.getElementById('editModal').classList.remove('hidden');
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('editModal').classList.add('hidden');
      document.getElementById('editModal').style.display = 'none';
      currentTicket = null;
    }

    async function saveTicket() {
      if (!currentTicket) return;
      const status = document.getElementById('editStatus').value;
      const reply = document.getElementById('editReply').value.trim();

      await fetch(`/api/staff/tickets/${currentTicket.id}`, {
        method: 'PATCH',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });

      if (reply) {
        await fetch(`/api/tickets/${currentTicket.id}/messages`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: reply })
        });
      }

      closeModal();
      loadStats();
      loadTickets();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.status;
        loadTickets();
      });
    });

    init();
  </script>
</body>
</html>
